<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8cc8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c4a35a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a07830;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo cuadrado redondeado -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>

  <!-- Borde dorado sutil -->
  <rect width="100" height="100" rx="18" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>

  <!-- Letra A — serif estilizada -->
  <!-- Trazo izquierdo -->
  <line x1="20" y1="78" x2="50" y2="18" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Trazo derecho -->
  <line x1="80" y1="78" x2="50" y2="18" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Travesaño — ligeramente desplazado abajo para look serif elegante -->
  <line x1="32" y1="57" x2="68" y2="57" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Punto de corona — estrella pequeña dorada en el vértice superior -->
  <circle cx="50" cy="18" r="3.5" fill="url(#gold)" opacity="0.9" filter="url(#glow)"/>

  <!-- Dos puntos de luz en los pies, como serifas minimalistas -->
  <circle cx="20" cy="78" r="2.5" fill="url(#gold)" opacity="0.7"/>
  <circle cx="80" cy="78" r="2.5" fill="url(#gold)" opacity="0.7"/>
</svg>
